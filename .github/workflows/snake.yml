name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, at midnight UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Two versions, so the README can show the right one for light and dark
      # GitHub. Colours are the portfolio's aquamarine at both strengths.
      - name: Generate the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b7a6b&color_dots=#ebedf0,#b6e9dc,#6ccfb8,#1d9e86,#0b7a6b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5fe3c6&color_dots=#161b22,#0e4038,#136d5e,#2eab92,#5fe3c6

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
